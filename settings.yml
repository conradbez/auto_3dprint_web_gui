# LLM used by `promptmap run` when there is no client.py (called via LiteLLM).
# provider: any LiteLLM provider; model: any model that provider serves.
# Edit freely — values are not validated. API keys come from .env / the environment.
# Aliases, picked in a .prompt with {{ config(model="medium") }} (also agent_model= / browser_model=):
provider: openrouter
model: low
aliases:
  medium: openrouter/moonshotai/kimi-k3.1-pro   # Kimi K3.1 Pro
  low: openrouter/deepseek/deepseek-v4.1-flash  # DeepSeek V4.1 Flash
