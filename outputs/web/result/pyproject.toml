[project]
name = "autoeject"
version = "0.1.0"
description = "Core geometry and eject G-code tools for the Bambu Lab A1"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "numpy>=2.0",
    "python-multipart>=0.0.9",
    "shapely>=2.0",
    "trimesh>=4.0",
    "uvicorn>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["autoeject"]

[dependency-groups]
dev = ["httpx>=0.27", "pytest>=8.0"]
