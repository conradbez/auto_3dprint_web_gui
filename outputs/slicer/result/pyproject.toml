[project]
name = "autoeject"
version = "0.1.0"
description = "Core geometry and eject G-code tools for the Bambu Lab A1"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.0",
    "shapely>=2.0",
    "trimesh>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["autoeject"]

[dependency-groups]
dev = ["pytest>=8.0"]
